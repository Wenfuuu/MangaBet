<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Offline · MangaBet</title>
		<style>
			:root {
				color-scheme: dark;
			}
			html,
			body {
				margin: 0;
				height: 100%;
				background: #0b0908;
				color: #e8dccb;
				font-family: 'Inter', system-ui, sans-serif;
				-webkit-font-smoothing: antialiased;
			}
			.wrap {
				height: 100%;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				gap: 1.25rem;
				text-align: center;
				padding: 2rem;
			}
			img {
				width: 88px;
				height: 88px;
				border-radius: 22px;
			}
			h1 {
				margin: 0;
				font-size: 1.35rem;
				font-weight: 600;
			}
			p {
				margin: 0;
				max-width: 28ch;
				color: #a08c70;
				line-height: 1.5;
			}
			.actions {
				margin-top: 0.5rem;
				display: flex;
				flex-wrap: wrap;
				justify-content: center;
				gap: 0.6rem;
			}
			.btn {
				display: inline-flex;
				align-items: center;
				padding: 0.65rem 1.4rem;
				border: 1px solid rgba(201, 163, 122, 0.25);
				border-radius: 999px;
				background: transparent;
				color: #c9a37a;
				font: inherit;
				font-weight: 500;
				text-decoration: none;
				cursor: pointer;
			}
			.btn:hover {
				background: rgba(201, 163, 122, 0.1);
			}
			.btn.primary {
				border-color: rgba(201, 163, 122, 0.45);
				background: rgba(201, 163, 122, 0.14);
			}
			.btn.primary:hover {
				background: rgba(201, 163, 122, 0.2);
			}
			/* Beats the display:inline-flex above, which would otherwise unhide the link. */
			[hidden] {
				display: none !important;
			}
		</style>
	</head>
	<body>
		<div class="wrap">
			<img src="/icon-192.png" alt="MangaBet" />
			<h1>You're offline</h1>
			<p>MangaBet can't reach the network right now. Check your connection and try again.</p>
			<div class="actions">
				<a class="btn primary" id="downloads-link" href="/downloads" hidden>Read saved chapters</a>
				<button class="btn" onclick="location.reload()">Retry</button>
			</div>
		</div>
		<script>
			// Key must stay in sync with MANIFEST_KEY in src/lib/offline.ts.
			try {
				const saved = JSON.parse(localStorage.getItem('mangabet:offline:v1') || '{}');
				const count = Object.keys(saved).length;
				if (count > 0) {
					const link = document.getElementById('downloads-link');
					link.textContent = 'Read saved chapters (' + count + ')';
					link.hidden = false;
				}
			} catch (err) {
				// Storage can be unavailable (private mode, blocked cookies) — just hide the link.
			}
		</script>
	</body>
</html>
